draft: false
Name: GBA PSG Voice
Description: Boots a cartridge-less Game Boy Advance over the pulse jacks via BIOS Multiboot, then plays it as a chiptune synth voice with the whole sound editor on the GBA's own screen
Language: C++ (RP2040 Pico SDK) + C (GBA payload)
Creator: Andy Jenkinson (uglifruit)
Version: 0.4.0
Status: Work in progress
License: MIT
Repository: https://github.com/TomWhitwell/Workshop_Computer/tree/main/releases/89_GBA

tags:
  - gba
  - link cable
  - multiboot
  - chiptune
  - psg
  - synth voice
  - drums
  - screen
  - experimental

manual: |
  GBA PSG Voice turns the Workshop Computer into a Game Boy Advance link-cable master and the
  GBA into a synth voice you play from the rack. Wire a bare GBA link socket to the pulse jacks
  (common ground), with 1k series resistors on the two lines the module drives:

    Pulse Out 1 -> GBA SC   (serial clock)   1k
    Pulse Out 2 -> GBA SI   (serial in)      1k
    Pulse In 1  -> GBA SO   (serial out)     no resistor

  Many GBA link cables cross SO/SI between their ends. Do not guess: flash
  diagnostics/cablecheck.uf2 and run MODE 0, which reports which wire actually carries SO.

  Power the Computer first, then the GBA - the console only syncs if the master is already
  clocking when it boots. Cartridge-less, on the logo screen. The instrument uploads in about
  six seconds; the module's LEDs show a progress bar while it does.

  POWER-CYCLE THE GBA WHENEVER YOU RE-FLASH THE WORKSHOP. A console already running a payload
  never answers a multiboot sync, so the host retries for ever: LED 0 blinking, LED 1 lit, and
  nothing reaching the screen.

  The GBA makes the sound on its own PSG hardware and puts it out of its HEADPHONE JACK, which
  goes to the rack. It is around 1 Vpp against Eurorack's 10 Vpp, so it will be quiet. The
  original GBA and the Game Boy Micro have a headphone socket; the GBA SP does not and needs the
  official SP adapter.

  Defaults: CV In 2 is 1V/oct pitch, Pulse In 2 and the momentary switch are triggers, CV In 1
  sweeps pulse duty, Audio In 1 detunes the second square, Audio In 2 drives the noise channel.
  All four jacks, the three knobs and the switch are re-assignable on the GBA's MAP page, each
  with its own set of per-voice tickboxes. Audio Out 1 and 2 send the GBA's A and B buttons back
  out as gates, so a performance gesture can drive the rest of the rack.

  On the GBA, START opens the editor on MEM - patch recall is the one editor action that happens
  mid-performance, so it is one gesture away - and SELECT + Left/Right walks the eleven pages:
  MEM, CHAN, TRIG, ENV, MIX, BTN, MAP, ORN, DRUM, CAL, SET. Editing is A + D-pad throughout;
  inside a menu no button carries its performance meaning.

  The CAL page trims the CV input scale and offset. The module's CV OUTPUTS are factory
  calibrated from its EEPROM, so the quantised pitch out is in tune for free, but the CV INPUTS
  are not calibrated at all - so 1V/oct tracking on CV In 2 has to be trimmed once, with the
  live note readout on that page to trim against.

  Sixteen patches are stored on the card itself (MEM page: A+UP saves, A+DOWN loads). Saving
  erases a flash sector, which briefly stops the audio - expect a click.

panel:
  inputs:
    - id: CVIn2
      name: Pitch
      description: 1V/oct pitch CV. Trim tracking on the GBA CAL page (CV inputs are not factory calibrated)
    - id: Pulse2
      name: Gate
      description: Gate and trigger. Edges shorter than the 1ms poll are still caught
    - id: CVIn1
      name: Timbre
      description: Pulse duty of the square channels by default; re-assignable on the MAP page
    - id: Audio1
      name: Detune
      description: Channel-2 detune by default; re-assignable on the MAP page
    - id: Audio2
      name: Noise
      description: Noise channel level by default; re-assignable on the MAP page
    - id: Main
      name: Knob A
      description: Free modulation source, assignable on the MAP page
    - id: X
      name: Knob B
      description: Free modulation source, assignable on the MAP page
    - id: Y
      name: Knob C
      description: Free modulation source, assignable on the MAP page
    - id: PulseIn1
      name: GBA SO (MISO)
      description: Serial data back from the GBA. Read directly via PIO, not the 48kHz pulse path
  outputs:
    - id: PulseOut1
      name: GBA SC (clock)
      description: Master serial clock driven by the RP2040 (PIO), inversion handled in hardware
    - id: PulseOut2
      name: GBA SI (MOSI)
      description: Serial data to the GBA (payload upload, then the live input stream)
    - id: CVOut2
      name: Quantised pitch
      description: The note the GBA is sounding, as calibrated 1V/oct. Turns the pair into a quantiser for the rest of the rack
    - id: CVOut1
      name: Gate out
      description: 5V while a note is sounding
    - id: AudioOut1
      name: A button gate
      description: High while the GBA's A button is held - the performance gesture as a patchable voltage
    - id: AudioOut2
      name: B button gate
      description: High while the GBA's B button is held

controls:
  switch:
    - id: Down
      name: Trigger
      description: Momentary down fires a note; a column of the GBA's TRIG grid
    - id: Up
      name: Modulation
      description: An eighth source on the GBA's MAP page - assign it to anything. Up is full, middle and down are zero
  leds:
    - id: LED0
      name: Link (solid booted, blinking connecting)
    - id: LED1
      name: Gate in / upload progress / fault code bit 0
    - id: LED2
      name: Note sounding / upload progress / fault code bit 1
    - id: LED3
      name: Editing on the GBA / upload progress / fault code bit 2
    - id: LED4
      name: Edit page bit 0 / upload progress
    - id: LED5
      name: Edit page bit 1 / upload progress
